<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Expense Tracker</title>
  </head>
  <body>
    <main class="container">
      <header>
        <div class="header-icon">
          <i class="fa-solid fa-wallet"></i>
        </div>
        <div>
          <h1>Expense Tracker</h1>
          <p>Track your spending. Build better habits.</p>
        </div>
      </header>
      <section class="form-section">
        <form id="expense-form">
          <div class="input-group">
            <label for="expense-name">Expense Name</label>
            <input
              type="text"
              id="expense-name"
              placeholder="e.g. Coffee"
              required
            />
          </div>
          <div class="input-group">
            <label for="expense-amount">Amount</label>
            <input
              type="number"
              id="expense-amount"
              placeholder="e.g. 15"
              min="0"
              required
            />
          </div>
          <div class="input-group">
            <label for="expense-category">Category</label>
            <select id="expense-category" required>
              <option value="">Select a category</option>
              <option value="food">Food</option>
              <option value="transport">Transport</option>
              <option value="shopping">Shopping</option>
              <option value="other">Other</option>
            </select>
          </div>
          <button type="submit" id="add-expense-btn">
            <i class="fa-solid fa-plus"></i>
            Add Expense
          </button>
        </form>
      </section>
      <section class="summary">
        <!-- Number of expenses -->
        <div class="summary-item">
          <div class="summary-icon expense-icon">
            <i class="fa-solid fa-list-check"></i>
          </div>
          <div class="summary-info">
            <span>Expenses</span>
            <strong id="expense-count">0</strong>
          </div>
        </div>
        <div class="divider"></div>
        <div class="summary-item">
          <div class="summary-icon total-icon">
            <i class="fa-solid fa-coins"></i>
          </div>
          <div class="summary-info">
            <span>Total Amount</span>
            <strong id="total-amount">0 MAD</strong>
          </div>
        </div>
      </section>
      <section class="expenses-section">
        <h2>Expenses</h2>
        <div class="expense-header">
          <span>#</span>
          <span>Name</span>
          <span>Amount</span>
          <span>Category</span>
          <span>Date</span>
          <span></span>
        </div>
        <div id="expense-list">
          <div class="expense-item">
            <span class="expense-number">1</span>
            <div class="expense-name">
              <div class="category-icon food-icon">
                <i class="fa-solid fa-mug-hot"></i>
              </div>
              <strong>Coffee</strong>
            </div>
            <strong class="expense-price"> 15 MAD </strong>
            <span class="category-badge food"> Food </span>
            <span class="expense-date"> Sep 20, 2026 </span>
            <button class="delete-btn" type="button">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
          <div class="expense-item">
            <span class="expense-number">2</span>
            <div class="expense-name">
              <div class="category-icon transport-icon">
                <i class="fa-solid fa-bus"></i>
              </div>
              <strong>Bus Ticket</strong>
            </div>
            <strong class="expense-price"> 20 MAD </strong>
            <span class="category-badge transport"> Transport </span>
            <span class="expense-date"> Sep 19, 2026 </span>
            <button class="delete-btn" type="button">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>
        <div id="empty-message" class="empty-message">
          <i class="fa-solid fa-receipt"></i>
          <p>No expenses yet.</p>
          <span>Add your first expense above.</span>
        </div>
      </section>
    </main>
    <script src="js/javascript.js"></script>
  </body>
</html>
